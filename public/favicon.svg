<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Catat Keuangan">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="coinGradient" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="walletGradient" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D97706" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bgGradient)"/>

  <!-- Wallet body -->
  <g filter="url(#shadow)">
    <path d="M8 10.5C8 9.119 9.119 8 10.5 8H21.5C22.881 8 24 9.119 24 10.5V23C24 24.381 22.881 25.5 21.5 25.5H10.5C9.119 25.5 8 24.381 8 23V10.5Z" fill="url(#walletGradient)" stroke="#FFFFFF" stroke-width="0.5"/>
    <!-- Wallet fold line -->
    <path d="M10.5 10.5V23" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    <path d="M21.5 10.5V23" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    <!-- Card slots -->
    <rect x="10.5" y="13" width="11" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.2"/>
    <rect x="10.5" y="16" width="11" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.15"/>
    <rect x="10.5" y="19" width="11" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.1"/>
  </g>

  <!-- Gold Rp Coin Badge -->
  <g filter="url(#coinShadow)">
    <!-- Coin base -->
    <circle cx="22" cy="10" r="6" fill="url(#coinGradient)"/>
    <!-- Coin inner highlight -->
    <circle cx="21" cy="9" r="4.5" fill="url(#coinGradient)" opacity="0.6"/>
    <!-- Rp text -->
    <text x="22" y="11.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="800" fill="#1E3A8A">Rp</text>
    <!-- Shine -->
    <ellipse cx="20" cy="8" rx="2" ry="1" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Subtle sparkle -->
  <g fill="#FBBF24" opacity="0.9">
    <polygon points="26,6 26.3,7 27.5,7 26.5,7.7 26.8,8.9 26,8.2 25.2,8.9 25.5,7.7 24.5,7 25.7,7"/>
    <polygon points="27.5,12 27.7,12.5 28.5,12.7 27.9,13.2 28,14 27.5,13.5 27,14 27.1,13.2 26.5,12.7 27.3,12.5" transform="scale(0.6) translate(30,12)"/>
  </g>
</svg>